[project]
name = "local-rag-sqlite"
version = "0.1.0"
description = "A small, readable local RAG pipeline: ingest -> chunk -> embed -> SQLite (sqlite-vec) -> retrieve -> generate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlite-vec>=0.1.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]   # default embedding model (downloads ~470 MB on first use)
ui = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
rag = "local_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
